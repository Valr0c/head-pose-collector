<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Head Pose Data Collector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================================================
       SCREEN 1 — REGISTRASI
  ==================================================== -->
  <div id="screen-register" class="screen active">
    <div class="reg-wrap">

      <div class="reg-header">
        <div class="reg-icon">📷</div>
        <h1>Head Pose Collector</h1>
        <p>Pengumpulan Data Wajah Otomatis Berbasis Sudut Kepala</p>
      </div>

      <form id="register-form" autocomplete="off">

        <div class="field">
          <label for="inp-name">Nama Lengkap / Subjek</label>
          <input type="text" id="inp-name" placeholder="Masukkan nama..." required />
        </div>

        <div class="field">
          <label for="inp-preset">Preset Sudut Pose</label>
          <select id="inp-preset">
            <option value="standard">Multi-PIE Standard — 9 Poses (-60° s/d +60°)</option>
            <option value="full">Multi-PIE Full — 13 Poses (-90° s/d +90°)</option>
            <option value="quick">Ringkas — 5 Poses (-45°, -20°, 0°, +20°, +45°)</option>
          </select>
        </div>

        <div class="field">
          <label>Toleransi Sudut Yaw: <strong id="lbl-tol">4</strong>°</label>
          <input type="range" id="inp-tol" min="2" max="10" value="4" />
        </div>

        <div class="field">
          <label>Mode Pengambilan: <strong style="color:var(--green)">Auto-Capture Instan (Langsung Foto)</strong></label>
        </div>

        <button type="submit" class="btn-start" id="btn-start">
          Mulai Sesi Foto ▶
        </button>

        <div id="loading-box" class="loading-box hidden">
          <div class="spinner"></div>
          <span>Memuat MediaPipe Face Landmarker…</span>
        </div>

      </form>
    </div>
  </div>

  <!-- ===================================================
       SCREEN 2 — KAMERA
  ==================================================== -->
  <div id="screen-camera" class="screen">

    <!-- Video stream -->
    <div id="cam-view">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- Kotak panduan posisi kepala di tengah layar -->
    <div id="center-guide">
      <div class="guide-corner tl"></div>
      <div class="guide-corner tr"></div>
      <div class="guide-corner bl"></div>
      <div class="guide-corner br"></div>
      <div class="guide-crosshair"></div>
      <div id="guide-status">Posisikan kepala di dalam kotak</div>
    </div>

    <!-- Flash putih saat foto -->
    <div id="flash-overlay"></div>

    <!-- Top bar: info subjek + progress -->
    <div id="bar-top">
      <div id="top-left">
        <div id="top-name">—</div>
        <div id="top-id">—</div>
      </div>
      <div id="top-right">
        <span id="top-count">0/0</span>
        <span id="top-done-lbl">Selesai</span>
      </div>
    </div>

    <!-- Target card (tengah atas) -->
    <div id="target-card">
      <div id="target-lbl">TARGET: 0°</div>
      <div id="instr-lbl">Mencari wajah…</div>
      <div id="hold-track"><div id="hold-fill"></div></div>
    </div>

    <!-- Sudut aktual (kiri bawah) -->
    <div id="angles-card">
      <div class="ang-row">
        <span class="ang-name">Yaw</span>
        <span class="ang-val" id="val-yaw">—</span>
      </div>
      <div class="ang-row">
        <span class="ang-name">Pitch</span>
        <span class="ang-val" id="val-pitch">—</span>
      </div>
      <div class="ang-row">
        <span class="ang-name">Roll</span>
        <span class="ang-val" id="val-roll">—</span>
      </div>
    </div>

    <!-- Checklist pose (kanan, bisa collapse) -->
    <div id="cl-panel">
      <button id="cl-toggle">☰</button>
      <div id="cl-body">
        <div id="cl-title">Checklist Pose</div>
        <ul id="cl-list"></ul>
      </div>
    </div>

    <!-- Banner semua pose selesai -->
    <div id="complete-banner" class="hidden">
      ✅ Semua pose lengkap!
      <button id="btn-dl-zip">⬇ Unduh Semua (.zip)</button>
    </div>

    <!-- Bottom controls -->
    <div id="bar-bottom">
      <button class="ctrl" id="btn-prev" title="Pose sebelumnya">◀</button>
      <button class="ctrl" id="btn-retake" title="Foto ulang">↺</button>
      <button class="ctrl shutter" id="btn-shutter" title="Foto manual">📷</button>
      <button class="ctrl" id="btn-next" title="Pose berikutnya">▶</button>
      <button class="ctrl done" id="btn-done" title="Selesai & Unduh">✓ Unduh</button>
    </div>

  </div>

  <!-- JSZip: paket foto jadi satu ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- App logic (ES Module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
